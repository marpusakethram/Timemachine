<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1360" viewBox="0 0 1200 1360" role="img" aria-labelledby="title desc"><title id="title">Time Machine architecture</title><desc id="desc">Inputs pass Zod validation into a pure 24-month financial engine. Optional Gemini candidates require consent and review. React Flow and Recharts display results. Saves use browser localStorage and exports are portable.</desc><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M-1 1 L1 -1 M0 7 L7 0 M6 8 L8 6" stroke="#a9bacd" stroke-width=".55"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#64748b" stroke-width="1.2"/></marker></defs><rect width="1200" height="1360" fill="#fff"/><g font-family="'Segoe Print','Comic Sans MS','Segoe UI',sans-serif"><text x="48" y="52" fill="#20334d" font-size="26" font-weight="700" letter-spacing="2">TIME MACHINE</text><text x="48" y="80" fill="#334155" font-size="15" >A local-first startup decision lab · conditional models, not forecasts</text><text x="1150" y="52" fill="#64748b" font-size="12" text-anchor="end">ARCHITECTURE / v1</text><text x="30" y="158" fill="#3d4858" font-size="14" letter-spacing="1">INPUTS</text><text x="30" y="180" fill="#7c8798" font-size="11" >Explicit user actions</text><rect x="220" y="115" width="260" height="105" rx="10" fill="white" stroke="#3b82f6" stroke-width="1.7" /><rect x="223" y="118" width="254" height="99" rx="8" fill="url(#hatch)" opacity=".25"/><text x="350" y="142" fill="#3b82f6" font-size="16" text-anchor="middle" font-weight="600">Startup dilemma</text><text x="350" y="169" fill="#526176" font-size="12" text-anchor="middle">Title + description + baseline</text><text x="350" y="190" fill="#526176" font-size="12" text-anchor="middle">Cash · revenue · costs · currency</text><rect x="510" y="115" width="255" height="105" rx="10" fill="white" stroke="#22a06b" stroke-width="1.7" /><rect x="513" y="118" width="249" height="99" rx="8" fill="url(#hatch)" opacity=".25"/><text x="637.5" y="142" fill="#22a06b" font-size="16" text-anchor="middle" font-weight="600">Local SaaS demo</text><text x="637.5" y="169" fill="#526176" font-size="12" text-anchor="middle">50k cash · 4k MRR · 24 months</text><text x="637.5" y="190" fill="#526176" font-size="12" text-anchor="middle">Three fictional strategic paths</text><rect x="795" y="115" width="330" height="105" rx="10" fill="white" stroke="#e29334" stroke-width="1.7" /><rect x="798" y="118" width="324" height="99" rx="8" fill="url(#hatch)" opacity=".25"/><text x="960" y="142" fill="#e29334" font-size="16" text-anchor="middle" font-weight="600">JSON import / hash share</text><text x="960" y="169" fill="#526176" font-size="12" text-anchor="middle">Versioned, portable scenario</text><text x="960" y="190" fill="#526176" font-size="12" text-anchor="middle">Warning before sharing full inputs</text><text x="30" y="304" fill="#3d4858" font-size="14" letter-spacing="1">VALIDATION</text><text x="30" y="326" fill="#7c8798" font-size="11" >Zod trust boundary</text><rect x="290" y="270" width="740" height="110" rx="10" fill="white" stroke="#e29334" stroke-width="1.7" /><rect x="293" y="273" width="734" height="104" rx="8" fill="url(#hatch)" opacity=".25"/><text x="660" y="297" fill="#e29334" font-size="16" text-anchor="middle" font-weight="600">Decision + Baseline + exactly 3 Branches</text><text x="660" y="324" fill="#526176" font-size="12" text-anchor="middle">UUIDs · bounded numeric values · schema_version · engine_version</text><text x="660" y="345" fill="#526176" font-size="12" text-anchor="middle">Units, ranges, provenance and last-edited timestamps · reject corrupt imports</text><path d="M 350 220 L 470 270" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 637 220 L 637 270" fill="none" stroke="#22a06b" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 960 220 L 850 270" fill="none" stroke="#e29334" stroke-width="1.6" marker-end="url(#arrow)" /><text x="30" y="451" fill="#3d4858" font-size="14" letter-spacing="1">SCENARIO DESIGN</text><text x="30" y="473" fill="#7c8798" font-size="11" >Optional model call</text><rect x="220" y="425" width="395" height="145" rx="10" fill="white" stroke="#8b5cf6" stroke-width="1.7" stroke-dasharray="7 5"/><rect x="223" y="428" width="389" height="139" rx="8" fill="url(#hatch)" opacity=".25"/><text x="417.5" y="452" fill="#8b5cf6" font-size="16" text-anchor="middle" font-weight="600">Gemini server route</text><text x="417.5" y="479" fill="#526176" font-size="12" text-anchor="middle">Official @google/genai SDK · key stays server-side</text><text x="417.5" y="500" fill="#526176" font-size="12" text-anchor="middle">Verified free-model allowlist · unbilled project</text><text x="417.5" y="521" fill="#526176" font-size="12" text-anchor="middle">Daily / per-run budgets · bounded retries</text><text x="417.5" y="542" fill="#526176" font-size="12" text-anchor="middle">20s timeout · output cap · SHA-256 cache</text><rect x="685" y="425" width="440" height="145" rx="10" fill="white" stroke="#22a06b" stroke-width="1.7" /><rect x="688" y="428" width="434" height="139" rx="8" fill="url(#hatch)" opacity=".25"/><text x="905" y="452" fill="#22a06b" font-size="16" text-anchor="middle" font-weight="600">Review candidate assumptions</text><text x="905" y="479" fill="#526176" font-size="12" text-anchor="middle">3 distinct pathways · 3–5 adjustable inputs each</text><text x="905" y="500" fill="#526176" font-size="12" text-anchor="middle">Inferred labels · explanations · risks · experiments</text><text x="905" y="521" fill="#526176" font-size="12" text-anchor="middle">Explicit review before applying candidates</text><text x="905" y="542" fill="#526176" font-size="12" text-anchor="middle">User-edited numbers preserved on regeneration</text><path d="M 500 380 L 415 425" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M 615 495 L 685 495" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M1030 325 L1150 325 L1150 605 L905 605 L905 620" fill="none" stroke="#22a06b" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1140" y="400" fill="#22a06b" font-size="11" text-anchor="end">No-key path</text><path d="M 905 570 L 905 620" fill="none" stroke="#22a06b" stroke-width="1.6" marker-end="url(#arrow)" /><text x="30" y="662" fill="#3d4858" font-size="14" letter-spacing="1">SIMULATION</text><text x="30" y="684" fill="#7c8798" font-size="11" >Pure TypeScript</text><rect x="220" y="620" width="905" height="174" rx="10" fill="white" stroke="#3b82f6" stroke-width="1.7" stroke-dasharray="7 5"/><rect x="223" y="623" width="899" height="168" rx="8" fill="url(#hatch)" opacity=".25"/><text x="672.5" y="647" fill="#3b82f6" font-size="16" text-anchor="middle" font-weight="600">Deterministic financial engine · 24 monthly snapshots</text><text x="672.5" y="674" fill="#526176" font-size="12" text-anchor="middle">Revenue = prior revenue × (1 + growth) × (1 − churn)</text><text x="672.5" y="695" fill="#526176" font-size="12" text-anchor="middle">Gross profit − operating expenses = operating cash flow</text><text x="672.5" y="716" fill="#526176" font-size="12" text-anchor="middle">Ending cash = beginning cash + operating CF + financing − one-time capex</text><text x="672.5" y="737" fill="#526176" font-size="12" text-anchor="middle">Hiring step changes · first cash shortfall · minimum cash · funding gap</text><text x="672.5" y="758" fill="#526176" font-size="12" text-anchor="middle">Priced-round dilution only when valuation is known · input fingerprint + timestamp</text><text x="30" y="874" fill="#3d4858" font-size="14" letter-spacing="1">EXPLORATION</text><text x="30" y="896" fill="#7c8798" font-size="11" >Immediate recomputation</text><rect x="220" y="845" width="270" height="115" rx="10" fill="white" stroke="#3b82f6" stroke-width="1.7" /><rect x="223" y="848" width="264" height="109" rx="8" fill="url(#hatch)" opacity=".25"/><text x="355" y="872" fill="#3b82f6" font-size="16" text-anchor="middle" font-weight="600">Branch graph</text><text x="355" y="899" fill="#526176" font-size="12" text-anchor="middle">React Flow · keyboard branch buttons</text><text x="355" y="920" fill="#526176" font-size="12" text-anchor="middle">Bootstrap / Hire / Raise</text><rect x="525" y="845" width="285" height="115" rx="10" fill="white" stroke="#8b5cf6" stroke-width="1.7" /><rect x="528" y="848" width="279" height="109" rx="8" fill="url(#hatch)" opacity=".25"/><text x="667.5" y="872" fill="#8b5cf6" font-size="16" text-anchor="middle" font-weight="600">Charts + comparison</text><text x="667.5" y="899" fill="#526176" font-size="12" text-anchor="middle">Recharts cash curves · ownership</text><text x="667.5" y="920" fill="#526176" font-size="12" text-anchor="middle">Sort by runway or ending cash</text><rect x="845" y="845" width="280" height="115" rx="10" fill="white" stroke="#22a06b" stroke-width="1.7" /><rect x="848" y="848" width="274" height="109" rx="8" fill="url(#hatch)" opacity=".25"/><text x="985" y="872" fill="#22a06b" font-size="16" text-anchor="middle" font-weight="600">Sensitivity lab</text><text x="985" y="899" fill="#526176" font-size="12" text-anchor="middle">Growth sweep + expense grid</text><text x="985" y="920" fill="#526176" font-size="12" text-anchor="middle">Fixed units · no certainty scores</text><path d="M 350 794 L 350 845" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 665 794 L 665 845" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 985 794 L 985 845" fill="none" stroke="#22a06b" stroke-width="1.6" marker-end="url(#arrow)" /><text x="30" y="1042" fill="#3d4858" font-size="14" letter-spacing="1">PERSISTENCE</text><text x="30" y="1064" fill="#7c8798" font-size="11" >Local by default</text><rect x="220" y="1010" width="435" height="115" rx="10" fill="white" stroke="#64748b" stroke-width="1.7" /><rect x="223" y="1013" width="429" height="109" rx="8" fill="url(#hatch)" opacity=".25"/><text x="437.5" y="1037" fill="#64748b" font-size="16" text-anchor="middle" font-weight="600">Browser localStorage</text><text x="437.5" y="1064" fill="#526176" font-size="12" text-anchor="middle">Create · save · edit · reload · reset</text><text x="437.5" y="1085" fill="#526176" font-size="12" text-anchor="middle">50 scenario limit · explicit deletion · no accounts</text><rect x="690" y="1010" width="435" height="115" rx="10" fill="white" stroke="#e29334" stroke-width="1.7" /><rect x="693" y="1013" width="429" height="109" rx="8" fill="url(#hatch)" opacity=".25"/><text x="907.5" y="1037" fill="#e29334" font-size="16" text-anchor="middle" font-weight="600">Portable outputs</text><text x="907.5" y="1064" fill="#526176" font-size="12" text-anchor="middle">Validated JSON · 24-row CSV · client PNG</text><text x="907.5" y="1085" fill="#526176" font-size="12" text-anchor="middle">Small hash links · export file for larger scenarios</text><path d="M 350 960 L 435 1010" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 985 960 L 910 1010" fill="none" stroke="#e29334" stroke-width="1.6" marker-end="url(#arrow)" /><rect x="220" y="1170" width="905" height="105" rx="10" fill="white" stroke="#64748b" stroke-width="1.7" /><rect x="223" y="1173" width="899" height="99" rx="8" fill="url(#hatch)" opacity=".25"/><text x="672.5" y="1197" fill="#64748b" font-size="16" text-anchor="middle" font-weight="600">Next.js + TypeScript + Tailwind + shadcn-style UI</text><text x="672.5" y="1224" fill="#526176" font-size="12" text-anchor="middle">One local Node process · no database service · no bank connections · no paid failover</text><text x="672.5" y="1245" fill="#526176" font-size="12" text-anchor="middle">Vitest engine / boundary tests + Playwright user flows + production build</text><path d="M 435 1125 L 435 1170" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 910 1125 L 910 1170" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" /><text x="600" y="1320" fill="#526176" font-size="14" text-anchor="middle">MODEL THE TRADE-OFF · every number is an assumption · no fetched market data</text></g></svg>